name: Build private desktop beta candidates
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installers:
    # Candidate artifacts must stay private until native acceptance passes.
    if: github.event.repository.private == true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
          - os: windows-latest
            script: dist:win
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: electron
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - run: npm install --global npm@12.1.0
      - run: npm ci
      - run: npm test
      - run: npm run verify:focus
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-beta-candidate-${{ matrix.os }}
          retention-days: 14
          path: |
            electron/dist/*.exe
            electron/dist/*.dmg
            electron/dist/SHA256SUMS.txt
