name: Build desktop beta installers
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a public beta release after both platform builds pass
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  installers:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
          - os: windows-latest
            script: dist:win
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: electron
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - run: npm install --global npm@12.1.0
      - run: npm ci
      - run: npm test
      - run: npm run verify:focus
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-beta-candidate-${{ matrix.os }}
          retention-days: 14
          path: |
            electron/dist/*.exe
            electron/dist/*.dmg
            electron/dist/SHA256SUMS.txt
  publish:
    if: inputs.publish
    needs: installers
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: desktop-beta-candidate-macos-latest
          path: downloaded/mac
      - uses: actions/download-artifact@v4
        with:
          name: desktop-beta-candidate-windows-latest
          path: downloaded/windows
      - name: Verify and publish installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./electron/package.json').version")
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists. Bump the desktop version before publishing."
            exit 1
          fi
          mkdir release
          cp downloaded/mac/*.dmg downloaded/windows/*.exe release/
          cat downloaded/mac/SHA256SUMS.txt downloaded/windows/SHA256SUMS.txt > release/SHA256SUMS.txt
          (cd release && sha256sum --check SHA256SUMS.txt)
          gh release create "$tag" release/* --target "$GITHUB_SHA" --prerelease \
            --title "Dragapultist desktop beta $version" --notes-file docs/desktop/RELEASE-NOTES.md
